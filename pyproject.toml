[project]
name = "issue_agent"
version = "0.1.0"
description = "Local MCP server that helps turn a GitHub issue into an open-source PR."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "PyGithub>=2.0,<3",
    "GitPython>=3.1,<4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27,<1",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "responses>=0.24",
    "mypy>=1.8",
    "ruff>=0.8",
]

[project.scripts]
issue-agent = "issue_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["issue_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
